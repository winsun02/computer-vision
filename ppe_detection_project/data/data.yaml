# YOLO dataset configuration for PPE detection.
# Update "path" to the dataset root that contains images/ and labels/.
# Expected structure:
# dataset_root/
#   images/train, images/val, images/test
#   labels/train, labels/val, labels/test

path: ../dataset/ppe_yolo
train: images/train
val: images/val
test: images/test

# Edit this list to match your dataset exactly. Class IDs in label .txt files
# must correspond to the index of each name below.
names:
  0: person
  1: helmet
  2: safety vest
  3: mask
  4: gloves
  5: goggles
  6: boots
  7: no-helmet
  8: no-vest
